[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prosody-or-adaptation"
version = "0.1.0"
description = "Code for separating auxiliary prosody from adaptation capacity in frozen HuBERT ASR"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "packaging>=23", "PyYAML>=6.0"]

[project.optional-dependencies]
train = ["torch==2.6.*", "torchaudio==2.6.*", "transformers==4.56.2", "datasets==2.21.0", "soundfile==0.12.1"]
dev = ["pytest>=8", "ruff==0.12.12"]

[project.scripts]
prosody-adaptation = "prosody_adaptation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
